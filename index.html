<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planet Forge — 程序化 3D 星球生成器</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="viewport">
      <canvas id="scene"></canvas>

      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>Planet Forge</h1>
            <p>程序化星球生成器 · 球面高度场 + 六套子系统</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="btn-random" type="button" title="随机种子 (R)">随机星球</button>
          <button id="btn-copy" type="button" title="复制分享链接">分享链接</button>
        </div>
      </header>

      <aside id="panel" class="panel">
        <div class="panel-head">
          <div class="panel-title">参数</div>
          <div class="panel-tools">
            <button id="btn-reset" type="button" class="ghost">重置</button>
            <button id="btn-collapse" type="button" class="ghost" aria-label="收起面板">⟨</button>
          </div>
        </div>
        <div id="groups" class="groups"></div>
      </aside>

      <button id="btn-expand" type="button" class="expand-tab" hidden>参数面板</button>

      <section class="hud" id="hud" aria-live="polite">
        <div class="hud-row"><span>顶点</span><b id="hud-verts">—</b></div>
        <div class="hud-row"><span>三角面</span><b id="hud-tris">—</b></div>
        <div class="hud-row"><span>地形起伏</span><b id="hud-relief">—</b></div>
        <div class="hud-row"><span>陆地占比</span><b id="hud-land">—</b></div>
        <div class="hud-row"><span>板块数</span><b id="hud-plates">—</b></div>
        <div class="hud-row"><span>云量</span><b id="hud-clouds">—</b></div>
        <div class="hud-row"><span>帧率</span><b id="hud-fps">—</b></div>
        <div class="hud-row"><span>重建耗时</span><b id="hud-gen">—</b></div>
        <div class="hud-row"><span>细节级别</span><b id="hud-lod">—</b></div>
        <div class="hud-row"><span>生成线程</span><b id="hud-mode">—</b></div>
      </section>

      <footer class="bottombar">
        <div class="seed-box">
          <label for="seed-input">种子</label>
          <input id="seed-input" type="text" spellcheck="false" autocomplete="off" />
          <button id="btn-apply-seed" type="button">应用</button>
        </div>
        <div class="export-box">
          <button id="btn-glb" type="button">导出 GLB</button>
          <button id="btn-json" type="button">导出场景 JSON</button>
          <button id="btn-png" type="button">截图 PNG</button>
        </div>
      </footer>

      <div id="toast" class="toast" role="status"></div>
      <div id="loading" class="loading"><span></span><p>正在生成星球…</p></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
